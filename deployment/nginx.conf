server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Entry points and the existing service-worker retirement script revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /offline-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Only Expo's content-hashed files are immutable. Missing assets stay 404.
    location ~ "^/(?:_expo|assets)/.+[.-][0-9a-f]{32}\.[^/]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /_expo/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(?:js|mjs|css|map|json|html|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|wasm|pdf|txt|xml)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client routes use the SPA shell; no API is proxied or cached here.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
